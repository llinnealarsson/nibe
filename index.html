<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Precision och träffsäkerhet - Resultat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        linear-gradient(rgba(0,0,0,0.38), rgba(0,0,0,0.38)),
        url("bakgrund.jpg") center center / cover no-repeat fixed;
      font-family: Montserrat, sans-serif;
      padding: 30px;
      margin: 0;
    }

    h1 {
      font-size: 110px;
      margin: 40px 0 10px 0;
      text-align: left;
      color: white;
      font-weight: 900;
      line-height: 0.95;
    }

    .date-row { margin-bottom:12px; font-size:18px; }
    select { font-size:14px; padding:4px 8px; margin-left:8px; }
    .absolute-date { position:absolute; top:10px; left:20px; z-index:1000; }
    .top-row { display:block; }
    .left-panel { margin-top:40px; }
    .bottom-row { margin-top:200px; }
    .tables-area { display:flex; gap:20px; }
    .cat-box { flex:1; background:#fff9cc; padding:30px; border-radius:16px; color:black; box-shadow:0 4px 10px rgba(0,0,0,0.2); min-width:200px; min-height:300px; box-sizing:border-box; }
    .cat-title { text-align:center; font-size:35px; font-weight:bold; margin-bottom:6px; }
    table { width:100%; border-collapse:collapse; font-size:30px; }
    th, td { padding:10px 6px; font-size:30px }
    th { text-align:left; border-bottom:1px solid rgba(255,255,255,0.5); }
    td:nth-child(2), th:nth-child(2) { text-align:right; }
    tbody tr:nth-child(odd) td { background: rgba(255,255,255,0.1); }

    @media (max-width:900px) {
      body { padding:16px; }
      .bottom-row .tables-area { flex-direction:column; }
    }
  </style>
</head>
<body>

<div class="date-row absolute-date">
  <label for="dateSelect"><b>Datum:</b></label>
  <select id="dateSelect"></select>
</div>

<div class="top-row">
  <div class="left-panel">
    <h1>Precision och<br>träffsäkerhet</h1>
  </div>
</div>

<div class="bottom-row">
  <div class="tables-area">
    <div class="cat-box">
      <div class="cat-title">Dam</div>
      <table>
        <thead><tr><th>Namn</th><th>Tid (s)</th></tr></thead>
        <tbody id="dam-body"></tbody>
      </table>
    </div>

    <div class="cat-box">
      <div class="cat-title">Herr</div>
      <table>
        <thead><tr><th>Namn</th><th>Tid (s)</th></tr></thead>
        <tbody id="herr-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const SHEET_ID = "11x7HWnWNqN1ic5TAbx1_4Sg5CdShMO__o99yvCWAnnc";
  const SHEET_NAME = "Formulärsvar 1";

  const GVIZ_URL =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
    `sheet=${encodeURIComponent(SHEET_NAME)}&tqx=out:json`;

  const REFRESH_MS = 3000;

  let allResults = [];
  let selectedDate = null;
  let dateSelectEl = null;

  document.addEventListener("DOMContentLoaded", () => {
    dateSelectEl = document.getElementById("dateSelect");

    dateSelectEl.addEventListener("change", () => {
      selectedDate = dateSelectEl.value;
      renderForDate(selectedDate);
    });

    loadData();
    setInterval(loadData, REFRESH_MS);
  });

  function loadData() {
    fetch(GVIZ_URL + "&t=" + Date.now(), { cache: "no-store" })
      .then(res => res.text())
      .then(text => {
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        const parsed = rows.map(r => {
          const c = r.c || [];

          const timestamp = c[0]?.f || c[0]?.v || "";
          const dateOnly = timestamp ? timestamp.toString().split(" ")[0] : "";

          return {
            name: (c[1]?.v || "").trim(),
            timeStr: (c[2]?.v || "").toString(),
            time: Number((c[2]?.v || "").toString().replace(",", ".")),
            cat: (c[3]?.v || "").trim(),
            date: dateOnly,
          };
        }).filter(r => r.name && r.date && r.cat);

        allResults = parsed;

        updateDateSelect();

        if (!selectedDate && allResults.length) {
          const dates = [...new Set(allResults.map(r => r.date))].sort();
          selectedDate = dates[dates.length - 1];
          dateSelectEl.value = selectedDate;
        }

        if (selectedDate) renderForDate(selectedDate);
      })
      .catch(err => {
        console.error("Fel vid hämtning av gviz:", err);
        clearTables();
      });
  }

  function updateDateSelect() {
    const dates = [...new Set(allResults.map(r => r.date))].sort();
    const sel = dateSelectEl;
    const previous = selectedDate;

    sel.innerHTML = "";
    dates.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    });

    if (dates.length === 0) {
      selectedDate = null;
      clearTables();
      return;
    }

    if (previous && dates.includes(previous)) {
      selectedDate = previous;
    } else {
      selectedDate = dates[dates.length - 1];
    }

    sel.value = selectedDate;
  }

  function clearTables() {
    ["dam-body", "herr-body"].forEach(id => {
      document.getElementById(id).innerHTML =
        `<tr><td colspan="2">Inga resultat</td></tr>`;
    });
  }

  function renderForDate(date) {
    const rowsForDate = allResults.filter(r => r.date === date);
    fillCategory("Dam", "dam-body", rowsForDate);
    fillCategory("Herr", "herr-body", rowsForDate);
  }

  function fillCategory(categoryName, tbodyId, rows) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = "";

    let list = rows.filter(r => r.cat === categoryName);

    list.sort((a, b) => {
      const aTime = isNaN(a.time) ? Number.POSITIVE_INFINITY : a.time;
      const bTime = isNaN(b.time) ? Number.POSITIVE_INFINITY : b.time;
      return aTime - bTime;
    });

    list = list.slice(0, 5);

    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="2">Inga resultat</td></tr>`;
      return;
    }

    list.forEach(r => {
      const tr = document.createElement("tr");
      const tdName = document.createElement("td");
      const tdTime = document.createElement("td");

      tdName.textContent = r.name;
      tdTime.textContent = isNaN(r.time) ? r.timeStr : r.time;

      tr.appendChild(tdName);
      tr.appendChild(tdTime);
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
