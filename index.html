<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Precision och träffsäkerhet - Resultat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        linear-gradient(rgba(0,0,0,0.42), rgba(0,0,0,0.42)),
        url("bakgrund.jpg") center center / cover no-repeat fixed;
      font-family: Montserrat, Arial, sans-serif;
      padding: 36px 60px 40px 60px;
      margin: 0;
      color: white;
    }

    h1 {
      font-size: 110px;
      margin: 40px 0 0 0;
      color: white;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -2px;
      text-align: left;
    }

    .hidden-date {
      display: none;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
    }

    .left-panel {
      flex: 1;
      padding-top: 20px;
    }

    .right-panel {
      width: 360px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding-top: 40px;
      flex-shrink: 0;
    }

    .logo-box {
      width: 260px;
      height: 180px;
      background: rgba(255,255,255,0.96);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }

    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      display: block;
      object-fit: contain;
    }

    .bottom-row {
      margin-top: 70px;
    }

    .tables-area {
      display: flex;
      gap: 90px;
      align-items: stretch;
    }

    .cat-box {
      flex: 1;
      background: rgba(255,255,255,0.88);
      padding: 28px 34px 28px 34px;
      color: black;
      min-height: 560px;
      box-sizing: border-box;
    }

    .cat-header {
      display: grid;
      grid-template-columns: 62px 1fr auto;
      align-items: center;
      gap: 16px;
      margin-bottom: 26px;
    }

    .arrow-box {
      width: 62px;
      height: 62px;
      background: #c91f1f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
    }

    .cat-title {
      font-size: 30px;
      font-weight: 800;
      text-align: left;
    }

    .time-title {
      font-size: 30px;
      font-weight: 800;
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 32px;
    }

    thead {
      display: none;
    }

    td {
      padding: 16px 0;
      font-size: 32px;
      vertical-align: middle;
    }

    td:first-child {
      text-align: left;
      padding-right: 20px;
    }

    td:last-child {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    tbody tr:nth-child(odd) td {
      background: transparent;
    }

    @media (max-width: 1200px) {
      body {
        padding: 24px;
      }

      h1 {
        font-size: 72px;
      }

      .top-row {
        flex-direction: column;
      }

      .right-panel {
        width: auto;
        padding-top: 10px;
      }

      .tables-area {
        flex-direction: column;
        gap: 24px;
      }

      .cat-box {
        min-height: 320px;
      }
    }
  </style>
</head>
<body>

<div class="hidden-date">
  <label for="dateSelect"><b>Datum:</b></label>
  <select id="dateSelect"></select>
</div>

<div class="top-row">
  <div class="left-panel">
    <h1>Precision och<br>träffsäkerhet</h1>
  </div>

  <div class="right-panel">
    <div class="logo-box">
      <img src="NIBE_Logo.png" alt="NIBE">
    </div>
  </div>
</div>

<div class="bottom-row">
  <div class="tables-area">
    <div class="cat-box">
      <div class="cat-header">
        <div class="arrow-box">→</div>
        <div class="cat-title">Herr</div>
        <div class="time-title">Tid/s</div>
      </div>
      <table>
        <tbody id="herr-body"></tbody>
      </table>
    </div>

    <div class="cat-box">
      <div class="cat-header">
        <div class="arrow-box">→</div>
        <div class="cat-title">Dam</div>
        <div class="time-title">Tid/s</div>
      </div>
      <table>
        <tbody id="dam-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // ======= KONSTANTER =======
  const SHEET_ID = "11x7HWnWNqN1ic5TAbx1_4Sg5CdShMO__o99yvCWAnnc";
  const SHEET_NAME = "Formulärsvar 1";

  // Google Sheets gviz-JSON (direkt mot arket, inte "publish to web")
  const GVIZ_URL =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
    `sheet=${encodeURIComponent(SHEET_NAME)}&tqx=out:json`;

  const REFRESH_MS = 3000;

  let allResults = [];
  let selectedDate = null;
  let dateSelectEl = null;

  document.addEventListener("DOMContentLoaded", () => {
    dateSelectEl = document.getElementById("dateSelect");

    dateSelectEl.addEventListener("change", () => {
      selectedDate = dateSelectEl.value;
      renderForDate(selectedDate);
    });

    loadData();
    setInterval(loadData, REFRESH_MS);
  });

  // ======= HÄMTA DATA FRÅN SHEET (GVIZ) =======
  function loadData() {
    fetch(GVIZ_URL + "&t=" + Date.now(), { cache: "no-store" })
      .then(res => res.text())
      .then(text => {
        // gviz-json är inlindat i en funktion → plocka ut JSON-delen
        const json = JSON.parse(text.substring(47, text.length - 2));
        const rows = json.table.rows;

        const parsed = rows.map(r => {
          const c = r.c; // kolumner: [timestamp, name, time, category, date]

          return {
            name: (c[1]?.v || "").trim(),
            timeStr: (c[2]?.v || "").toString(),
            time: Number((c[2]?.v || "").toString().replace(",", ".")),
            cat: (c[3]?.v || "").trim(),
            date: (c[4]?.v || "").trim(),
          };
        }).filter(r => r.name && r.date && r.cat);

        allResults = parsed;

        updateDateSelect();

        if (!selectedDate && allResults.length) {
          const dates = [...new Set(allResults.map(r => r.date))].sort();
          selectedDate = dates[dates.length - 1];
          dateSelectEl.value = selectedDate;
        }

        if (selectedDate) renderForDate(selectedDate);
      })
      .catch(err => {
        console.error("Fel vid hämtning av gviz:", err);
        clearTables();
      });
  }

  // ======= DATUM-DROPDOWN =======
  function updateDateSelect() {
    const dates = [...new Set(allResults.map(r => r.date))].sort();
    const sel = dateSelectEl;
    const previous = selectedDate;

    sel.innerHTML = "";
    dates.forEach(d => {
      const opt = document.createElement("option");
      opt.value = d;
      opt.textContent = d;
      sel.appendChild(opt);
    });

    if (dates.length === 0) {
      selectedDate = null;
      clearTables();
      return;
    }

    if (previous && dates.includes(previous)) {
      selectedDate = previous;
    } else {
      selectedDate = dates[dates.length - 1];
    }

    sel.value = selectedDate;
  }

  function clearTables() {
    ["dam-body", "herr-body"].forEach(id => {
      document.getElementById(id).innerHTML =
        `<tr><td colspan="2">Inga resultat</td></tr>`;
    });
  }

  // ======= RITA TABELLERNA FÖR ETT DATUM =======
  function renderForDate(date) {
    const rowsForDate = allResults.filter(r => r.date === date);
    fillCategory("Dam", "dam-body", rowsForDate);
    fillCategory("Herr", "herr-body", rowsForDate);
  }

  // ======= TOPP 5 PER KATEGORI =======
  function fillCategory(categoryName, tbodyId, rows) {
    const tbody = document.getElementById(tbodyId);
    tbody.innerHTML = "";

    let list = rows.filter(r => r.cat === categoryName);

    list.sort((a, b) => {
      const aTime = isNaN(a.time) ? Number.POSITIVE_INFINITY : a.time;
      const bTime = isNaN(b.time) ? Number.POSITIVE_INFINITY : b.time;
      return aTime - bTime;
    });

    list = list.slice(0, 5);

    if (!list.length) {
      tbody.innerHTML = `<tr><td colspan="2">Inga resultat</td></tr>`;
      return;
    }

    list.forEach(r => {
      const tr = document.createElement("tr");
      const tdName = document.createElement("td");
      const tdTime = document.createElement("td");

      tdName.textContent = r.name;
      tdTime.textContent = isNaN(r.time) ? r.timeStr : r.time;

      tr.appendChild(tdName);
      tr.appendChild(tdTime);
      tbody.appendChild(tr);
    });
  }
</script>

</body>
</html>
