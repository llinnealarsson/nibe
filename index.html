<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Precision och träffsäkerhet - Resultat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      background:
        linear-gradient(rgba(0,0,0,0.42), rgba(0,0,0,0.42)),
        url("bakgrund.jpg") center center / cover no-repeat fixed;
      font-family: Montserrat, Arial, sans-serif;
      margin: 0;
      color: white;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 22px 30px 28px 30px;
      box-sizing: border-box;
    }

    .date-row {
      position: absolute;
      top: 18px;
      left: 22px;
      z-index: 1000;
      font-size: 16px;
      color: white;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-row label {
      font-weight: 700;
    }

    select {
      font-size: 14px;
      padding: 4px 8px;
      border: none;
      border-radius: 0;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 40px;
      padding-top: 28px;
    }

    .left-panel {
      flex: 1;
      padding-top: 60px;
    }

    h1 {
      font-size: clamp(72px, 7vw, 110px);
      margin: 0;
      color: white;
      font-weight: 900;
      line-height: 0.94;
      letter-spacing: -2px;
      text-align: left;
    }

    .right-panel {
      width: 280px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      flex-shrink: 0;
      padding-top: 60px;
    }

    .logo-img {
      width: 100%;
      max-width: 240px;
      height: auto;
      display: block;
      object-fit: contain;
    }

    .bottom-row {
      margin-top: 90px;
    }

    .tables-area {
      display: flex;
      gap: 28px;
      align-items: stretch;
    }

    .cat-box {
      flex: 1;
      background: rgba(255,255,255,0.90);
      color: black;
      min-height: 420px;
      padding: 22px 28px 24px 28px;
      box-sizing: border-box;
    }

    .cat-header {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .arrow-box {
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .cat-title {
      font-size: 20px;
      font-weight: 800;
      text-align: left;
    }

    .time-title {
      font-size: 20px;
      font-weight: 800;
      text-align: right;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead {
      display: none;
    }

    td {
      padding: 12px 0;
      font-size: 22px;
      vertical-align: middle;
    }

    td:first-child {
      text-align: left;
      padding-right: 20px;
    }

    td:last-child {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .empty-row td {
      color: #444;
    }

    @media (max-width: 1200px) {
      .page {
        padding: 20px;
      }

      .top-row {
        flex-direction: column;
      }

      h1 {
        font-size: 70px;
      }

      .right-panel {
        width: auto;
        padding-top: 20px;
      }

      .bottom-row {
        margin-top: 40px;
      }

      .tables-area {
        flex-direction: column;
      }

      .cat-box {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <div class="date-row">
      <label for="dateSelect">Datum:</label>
      <select id="dateSelect"></select>
    </div>

    <div class="top-row">
      <div class="left-panel">
        <h1>Precision och<br>träffsäkerhet</h1>
      </div>

      <div class="right-panel">
        <img class="logo-img" src="NIBE_Logo.png" alt="NIBE">
      </div>
    </div>

    <div class="bottom-row">
      <div class="tables-area">
        <div class="cat-box">
          <div class="cat-header">
            <div class="arrow-box">
              <img src="Nibe Pil RGB.png" alt="Pil">
            </div>
            <div class="cat-title">Herr</div>
            <div class="time-title">Tid</div>
          </div>
          <table>
            <tbody id="herr-body"></tbody>
          </table>
        </div>

        <div class="cat-box">
          <div class="cat-header">
            <div class="arrow-box">
              <img src="Nibe Pil RGB.png" alt="Pil">
            </div>
            <div class="cat-title">Dam</div>
            <div class="time-title">Tid</div>
          </div>
          <table>
            <tbody id="dam-body"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ======= KONSTANTER =======
    const SHEET_ID = "11x7HWnWNqN1ic5TAbx1_4Sg5CdShMO__o99yvCWAnnc";
    const SHEET_NAME = "Formulärsvar 1";

    // Google Sheets gviz-JSON (direkt mot arket, inte "publish to web")
    const GVIZ_URL =
      `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?` +
      `sheet=${encodeURIComponent(SHEET_NAME)}&tqx=out:json`;

    const REFRESH_MS = 3000;

    let allResults = [];
    let selectedDate = null;
    let dateSelectEl = null;

    document.addEventListener("DOMContentLoaded", () => {
      dateSelectEl = document.getElementById("dateSelect");

      dateSelectEl.addEventListener("change", () => {
        selectedDate = dateSelectEl.value;
        renderForDate(selectedDate);
      });

      loadData();
      setInterval(loadData, REFRESH_MS);
    });

    // ======= HÄMTA DATA FRÅN SHEET (GVIZ) =======
    function loadData() {
      fetch(GVIZ_URL + "&t=" + Date.now(), { cache: "no-store" })
        .then(res => res.text())
        .then(text => {
          const json = JSON.parse(text.substring(47, text.length - 2));
          const rows = json.table.rows || [];

          const parsed = rows.map(r => {
            const c = r.c || [];

            return {
              name: (c[1]?.v || "").trim(),
              timeStr: (c[2]?.v || "").toString().trim(),
              time: Number((c[2]?.v || "").toString().replace(",", ".")),
              cat: (c[3]?.v || "").trim(),
              date: (c[4]?.v || "").trim(),
            };
          }).filter(r => r.name && r.date && r.cat);

          allResults = parsed;

          updateDateSelect();

          if (!selectedDate && allResults.length) {
            const dates = [...new Set(allResults.map(r => r.date))].sort();
            selectedDate = dates[dates.length - 1];
            dateSelectEl.value = selectedDate;
          }

          if (selectedDate) renderForDate(selectedDate);
        })
        .catch(err => {
          console.error("Fel vid hämtning av gviz:", err);
          clearTables();
        });
    }

    // ======= DATUM-DROPDOWN =======
    function updateDateSelect() {
      const dates = [...new Set(allResults.map(r => r.date))].sort();
      const sel = dateSelectEl;
      const previous = selectedDate;

      sel.innerHTML = "";
      dates.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        sel.appendChild(opt);
      });

      if (dates.length === 0) {
        selectedDate = null;
        clearTables();
        return;
      }

      if (previous && dates.includes(previous)) {
        selectedDate = previous;
      } else {
        selectedDate = dates[dates.length - 1];
      }

      sel.value = selectedDate;
    }

    function clearTables() {
      ["dam-body", "herr-body"].forEach(id => {
        document.getElementById(id).innerHTML =
          `<tr class="empty-row"><td colspan="2">Inga resultat</td></tr>`;
      });
    }

    // ======= RITA TABELLERNA FÖR ETT DATUM =======
    function renderForDate(date) {
      const rowsForDate = allResults.filter(r => r.date === date);
      fillCategory("Dam", "dam-body", rowsForDate);
      fillCategory("Herr", "herr-body", rowsForDate);
    }

    // ======= FORMATERA TID =======
    function formatTime(secondsValue, originalValue) {
      if (isNaN(secondsValue)) {
        return originalValue;
      }

      const totalSeconds = Math.round(secondsValue);
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const pad = n => String(n).padStart(2, "0");

      if (hours > 0) {
        return `${hours}:${pad(minutes)}:${pad(seconds)}`;
      }

      return `${minutes}:${pad(seconds)}`;
    }

    // ======= TOPP 5 PER KATEGORI =======
    function fillCategory(categoryName, tbodyId, rows) {
      const tbody = document.getElementById(tbodyId);
      tbody.innerHTML = "";

      let list = rows.filter(r => r.cat === categoryName);

      list.sort((a, b) => {
        const aTime = isNaN(a.time) ? Number.POSITIVE_INFINITY : a.time;
        const bTime = isNaN(b.time) ? Number.POSITIVE_INFINITY : b.time;
        return aTime - bTime;
      });

      list = list.slice(0, 5);

      if (!list.length) {
        tbody.innerHTML = `<tr class="empty-row"><td colspan="2">Inga resultat</td></tr>`;
        return;
      }

      list.forEach(r => {
        const tr = document.createElement("tr");
        const tdName = document.createElement("td");
        const tdTime = document.createElement("td");

        tdName.textContent = r.name;
        tdTime.textContent = formatTime(r.time, r.timeStr);

        tr.appendChild(tdName);
        tr.appendChild(tdTime);
        tbody.appendChild(tr);
      });
    }
  </script>
</body>
</html>
